name: IAM-G1 B2 independent read-only ciphertext readback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iam-g1-b2-independent-readback
  cancel-in-progress: false

jobs:
  ciphertext-integrity:
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: IAM-G1-B2-Readback-Custody
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source without persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate local checksum and size gates without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/iam-g1-b2-readback.py --self-test
      - name: Verify encrypted object with independent B2 read-only key
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IAM_G1_B2_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IAM_G1_B2_READ_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          umask 077
          python3 -m venv "$RUNNER_TEMP/iam-g1-b2-readback-venv"
          "$RUNNER_TEMP/iam-g1-b2-readback-venv/bin/python" -m pip install --disable-pip-version-check --quiet 'boto3>=1.35,<2'
          "$RUNNER_TEMP/iam-g1-b2-readback-venv/bin/python" scripts/iam-g1-b2-readback.py
