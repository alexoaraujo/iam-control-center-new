name: IAM-G1 B2 environment guard (offline)

on:
  pull_request:
    paths:
      - 'scripts/iam-g1-b2-environment.sh'
      - 'scripts/test-iam-g1-b2-environment-policy.py'
      - 'docs/operations/iam-g1-b2-custody-reconciliation.md'
      - '.github/workflows/iam-g1-b2-policy-test.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/iam-g1-b2-environment.sh'
      - 'scripts/test-iam-g1-b2-environment-policy.py'
      - 'docs/operations/iam-g1-b2-custody-reconciliation.md'
      - '.github/workflows/iam-g1-b2-policy-test.yml'

permissions:
  contents: read

jobs:
  policy-regression:
    if: github.repository == 'alexoaraujo/iam-control-center-new'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify environment guard syntax and offline behavior
        shell: bash
        run: |
          set -euo pipefail
          command -v jq
          bash -n scripts/iam-g1-b2-environment.sh
          python3 scripts/test-iam-g1-b2-environment-policy.py
