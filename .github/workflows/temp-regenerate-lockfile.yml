name: Temporary patched lockfile regeneration

on:
  push:
    branches:
      - fix/security-minimatch-ghsa-g3hv-75wg-m249

permissions:
  contents: read

jobs:
  regenerate-lockfile:
    if: github.event.head_commit.message == 'chore(ci): regenerate patched lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Regenerate lockfile metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
