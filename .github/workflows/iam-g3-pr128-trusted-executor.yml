name: IAM G3 PR128 trusted executor

# Runs trusted default-branch code only. The PR head SHA is validated as data;
# no PR-head file is checked out, imported, sourced, or executed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: iam-g3-pr128-trusted-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'alexoaraujo/iam-control-center-new' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.number == 128 &&
          github.event.pull_request.head.ref == 'integration/peos-single-maintainer-bun-20261117' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 128 &&
          github.event.issue.pull_request != null &&
          github.event.comment.user.login == 'alexoaraujo' &&
          github.event.comment.body == '/peos-g3-pr128-run'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      preview_url: ${{ steps.validate.outputs.preview_url }}
    steps:
      - name: Resolve PR128 from trusted GitHub metadata and verify exact-SHA Preview
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            pr="$(jq -c '.pull_request' "${GITHUB_EVENT_PATH}")"
          elif [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            pr="$(gh api "repos/${REPOSITORY}/pulls/128")"
          else
            echo "::error::Unsupported G3 trigger."
            exit 1
          fi

          state="$(jq -r '.state // ""' <<< "${pr}")"
          draft="$(jq -r '.draft // true' <<< "${pr}")"
          number="$(jq -r '.number // 0' <<< "${pr}")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "${pr}")"
          head_ref="$(jq -r '.head.ref // ""' <<< "${pr}")"
          head_sha="$(jq -r '.head.sha // ""' <<< "${pr}")"
          base_ref="$(jq -r '.base.ref // ""' <<< "${pr}")"

          [[ "${number}" == "128" && "${state}" == "open" && "${draft}" == "false" ]] || {
            echo "::error::PR128 must remain OPEN and non-draft."
            exit 1
          }
          [[ "${head_repo}" == "${REPOSITORY}" ]] || {
            echo "::error::PR128 head must remain in the trusted repository."
            exit 1
          }
          [[ "${head_ref}" == "integration/peos-single-maintainer-bun-20261117" && "${base_ref}" == "main" ]] || {
            echo "::error::PR128 branch/base identity changed."
            exit 1
          }
          [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::PR128 head SHA is invalid."
            exit 1
          }

          checks="$(gh api "repos/${REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")"
          for required in quality security-gate auth0-e2e preview-deployment sync-auth0-preview; do
            jq -e --arg sha "${head_sha}" --arg name "${required}" '
              [.check_runs[]
                | select(
                    .head_sha == $sha
                    and .app.slug == "github-actions"
                    and .name == $name
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ] | length == 1
            ' <<< "${checks}" >/dev/null || {
              echo "::error::Required exact-SHA check did not pass: ${required}."
              exit 1
            }
          done
          jq -e --arg sha "${head_sha}" --arg alias "iam-control-center-new-pr128-ci.vercel.app" '
            [.check_runs[]
              | select(
                  .head_sha == $sha
                  and .app.slug == "vercel"
                  and .name == "Vercel Preview Comments"
                  and .status == "completed"
                  and .conclusion == "success"
                  and ((.output.summary // "") | contains($alias))
                )
            ] | length == 1
          ' <<< "${checks}" >/dev/null || {
            echo "::error::No unique successful Vercel Preview check is bound to the exact PR128 head SHA."
            exit 1
          }

          printf 'eligible=true\n' >> "${GITHUB_OUTPUT}"
          printf 'head_sha=%s\n' "${head_sha}" >> "${GITHUB_OUTPUT}"
          printf 'preview_url=https://iam-control-center-new-pr128-ci.vercel.app\n' >> "${GITHUB_OUTPUT}"
          echo "PASS_G3_TRUSTED_PR128_METADATA_AND_EXACT_SHA_PREVIEW"
          echo "PR128 SHA: ${head_sha}"

  execute:
    name: Execute trusted G3 Auth0/RBAC proof
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: IAM-G3-PR128-Disposable-RBAC
    permissions:
      contents: read
      pull-requests: read
      checks: read
      id-token: write
    env:
      G3_PR_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
      G3_APPROVED_SHA: ${{ vars.IAM_RBAC_PR128_APPROVED_SHA }}
      E2E_BASE_URL: ${{ needs.preflight.outputs.preview_url }}
      E2E_CALLBACK_HOST: iam-control-center-new-pr128-ci.vercel.app
      E2E_CALLBACK_BRANCH: integration/peos-single-maintainer-bun-20261117
      AUTH0_DOMAIN: iam-control-center.us.auth0.com
      AUTH0_E2E_EXPECTED_SUB_SHA256: e8cd8b1bf515f595a4531fb01ed6ae3d42c8929d28a50416759789376423a9f0
      AUTH0_E2E_SESSION_ABSOLUTE_SECONDS: '45'
      E2E_RBAC_PROJECT_ID: tiny-rice-70320263
      E2E_RBAC_PR128_BRANCH_ID: br-super-sound-b63gtz88
    steps:
      - name: Checkout trusted default-branch source only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove executor source is the trusted main commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "::error::G3 executor must run from refs/heads/main."
            exit 1
          }
          checked_out="$(git rev-parse HEAD)"
          [[ "${checked_out}" == "${GITHUB_SHA}" ]] || {
            echo "::error::Trusted checkout does not match the workflow base SHA."
            exit 1
          }
          echo "PASS_G3_EXECUTOR_SOURCE_IS_TRUSTED_MAIN ${checked_out}"

      - name: Revalidate PR128 and all exact-SHA checks immediately before secret use
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
          APPROVED_SHA: ${{ vars.IAM_RBAC_PR128_APPROVED_SHA }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${REPOSITORY}/pulls/128")"
          current_sha="$(jq -r '.head.sha // ""' <<< "${pr}")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "${pr}")"
          head_ref="$(jq -r '.head.ref // ""' <<< "${pr}")"
          base_ref="$(jq -r '.base.ref // ""' <<< "${pr}")"
          state="$(jq -r '.state // ""' <<< "${pr}")"
          draft="$(jq -r '.draft // true' <<< "${pr}")"
          [[ "${current_sha}" == "${EXPECTED_SHA}" && "${current_sha}" == "${APPROVED_SHA}" ]] || {
            echo "::error::PR128 SHA changed after preflight or no longer matches the G3 approval."
            exit 1
          }
          [[ "${head_repo}" == "${REPOSITORY}" && "${head_ref}" == "integration/peos-single-maintainer-bun-20261117" && "${base_ref}" == "main" && "${state}" == "open" && "${draft}" == "false" ]] || {
            echo "::error::PR128 identity/state changed after preflight."
            exit 1
          }
          checks="$(gh api "repos/${REPOSITORY}/commits/${current_sha}/check-runs?per_page=100")"
          for required in quality security-gate auth0-e2e preview-deployment sync-auth0-preview; do
            jq -e --arg sha "${current_sha}" --arg name "${required}" '
              [.check_runs[]
                | select(
                    .head_sha == $sha
                    and .app.slug == "github-actions"
                    and .name == $name
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ] | length == 1
            ' <<< "${checks}" >/dev/null || {
              echo "::error::Exact-SHA prerequisite changed or is no longer successful: ${required}."
              exit 1
            }
          done
          jq -e --arg sha "${current_sha}" --arg alias "iam-control-center-new-pr128-ci.vercel.app" '
            [.check_runs[]
              | select(
                  .head_sha == $sha
                  and .app.slug == "vercel"
                  and .name == "Vercel Preview Comments"
                  and .status == "completed"
                  and .conclusion == "success"
                  and ((.output.summary // "") | contains($alias))
                )
            ] | length == 1
          ' <<< "${checks}" >/dev/null || {
            echo "::error::Exact-SHA Vercel Preview binding changed after preflight."
            exit 1
          }
          echo "PASS_G3_PR128_HEAD_AND_PREVIEW_REVALIDATED_BEFORE_SECRET_USE"

      - name: Verify exact approved SHA and protected credential availability
        shell: bash
        env:
          OWNER_DATABASE_URL: ${{ secrets.NEON_RBAC_PR128_TEST_OWNER_DATABASE_URL }}
          AUTH0_E2E_USERNAME: ${{ secrets.AUTH0_E2E_USERNAME }}
          AUTH0_E2E_PASSWORD: ${{ secrets.AUTH0_E2E_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "${G3_APPROVED_SHA}" =~ ^[0-9a-f]{40}$ && "${G3_APPROVED_SHA}" == "${G3_PR_HEAD_SHA}" ]] || {
            echo "::error::G3 approved SHA does not equal the current PR128 head."
            exit 1
          }
          [[ -n "${OWNER_DATABASE_URL:-}" ]] || {
            echo "::error::G3 owner secret is unavailable in the dedicated Environment."
            exit 1
          }
          [[ -n "${AUTH0_E2E_USERNAME:-}" && -n "${AUTH0_E2E_PASSWORD:-}" ]] || {
            echo "::error::Auth0 E2E credentials are not available to the dedicated G3 job. Provision them in G3 or as repository secrets; do not copy the owner secret to Preview."
            exit 1
          }
          node <<'NODE'
          const raw = process.env.OWNER_DATABASE_URL;
          let uri;
          try { uri = new URL(raw); } catch { throw new Error("G3 owner URL is not a valid PostgreSQL URI."); }
          const valid = uri.protocol === "postgresql:" &&
            uri.hostname === "ep-red-sunset-b6ozp5b2.c-2.sa-east-1.aws.neon.tech" &&
            uri.pathname === "/iam_database" &&
            decodeURIComponent(uri.username) === "neondb_owner" &&
            Boolean(uri.password) &&
            uri.searchParams.get("sslmode") === "verify-full" &&
            uri.searchParams.get("sslrootcert") === "system";
          if (!valid) throw new Error("G3 owner URL failed the direct-host/database/role/TLS allowlist.");
          console.log("PASS_G3_OWNER_SECRET_PRESENT_AND_DIRECT_TLS_POLICY_MATCHES");
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install isolated trusted Playwright and Neon clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/g3"
          npm install --prefix "${RUNNER_TEMP}/g3" --no-save --no-audit --no-fund \
            @playwright/test@1.64.1 @neondatabase/serverless@1.2.0
          npm audit --prefix "${RUNNER_TEMP}/g3" --audit-level=high

      - name: Install Chromium
        run: "${RUNNER_TEMP}/g3/node_modules/.bin/playwright install --with-deps chromium"

      - name: Request and validate the G3-specific GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --get \
            --data-urlencode "audience=https://github.com/alexoaraujo" \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(jq -er '.value | select(type == "string" and length > 0)' <<< "${response}")"
          printf '::add-mask::%s\n' "${token}"
          VERCEL_TRUSTED_OIDC_TOKEN="${token}" node <<'NODE'
          const token = process.env.VERCEL_TRUSTED_OIDC_TOKEN;
          const parts = token?.split(".");
          if (!parts || parts.length !== 3) throw new Error("G3 OIDC token is not a JWT.");
          const claims = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
          const audience = Array.isArray(claims.aud) ? claims.aud : [claims.aud];
          const expectedSubject = "repo:alexoaraujo@325264809/iam-control-center-new@1451861889:environment:IAM-G3-PR128-Disposable-RBAC";
          const expectedWorkflow = "alexoaraujo/iam-control-center-new/.github/workflows/iam-g3-pr128-trusted-executor.yml@refs/heads/main";
          const now = Math.floor(Date.now() / 1000);
          if (claims.iss !== "https://token.actions.githubusercontent.com" ||
              !audience.includes("https://github.com/alexoaraujo") ||
              claims.sub !== expectedSubject ||
              claims.ref !== "refs/heads/main" ||
              claims.environment !== "IAM-G3-PR128-Disposable-RBAC" ||
              claims.workflow_ref !== expectedWorkflow ||
              claims.workflow_sha !== process.env.GITHUB_SHA ||
              String(claims.repository_id) !== "1451861889" ||
              String(claims.repository_owner_id) !== "325264809" ||
              !["pull_request_target", "issue_comment"].includes(claims.event_name) ||
              !Number.isFinite(claims.iat) || !Number.isFinite(claims.exp) ||
              claims.iat > now + 60 || claims.exp <= now) {
            throw new Error("G3 OIDC claims do not match the dedicated Environment/main trusted workflow.");
          }
          console.log("PASS_G3_OIDC_SUBJECT_AUDIENCE_MAIN_AND_WORKFLOW_CLAIMS");
          NODE
          printf 'VERCEL_TRUSTED_OIDC_TOKEN=%s\n' "${token}" >> "${GITHUB_ENV}"
          unset token response

      - name: Verify Vercel Deployment Protection negative and positive controls
        shell: bash
        env:
          PREVIEW_URL: ${{ needs.preflight.outputs.preview_url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const origin = new URL(process.env.PREVIEW_URL);
          const token = process.env.VERCEL_TRUSTED_OIDC_TOKEN;
          const header = "x-vercel-trusted-oidc-idp-token";
          const auth0Host = "iam-control-center.us.auth0.com";
          if (!token || origin.hostname !== "iam-control-center-new-pr128-ci.vercel.app") {
            throw new Error("G3 Preview host or OIDC token is not approved.");
          }
          const anonymous = await fetch(new URL("/protected", origin), { redirect: "manual" });
          const location = anonymous.headers.get("location");
          const blocked = anonymous.status === 401 || anonymous.status === 403 ||
            (location && new URL(location, origin).hostname === "vercel.com");
          if (!blocked) throw new Error("Vercel negative control failed: HTTP " + anonymous.status + ".");
          console.log("PASS_G3_VERCEL_ANONYMOUS_NEGATIVE_CONTROL");
          async function reachAuth0(start, label) {
            let current = new URL(start);
            for (let attempt = 0; attempt < 6; attempt += 1) {
              if (current.hostname !== origin.hostname) throw new Error(label + ": refusing OIDC header outside the exact Preview host.");
              const response = await fetch(current, { redirect: "manual", headers: { [header]: token } });
              const nextLocation = response.headers.get("location");
              if (!nextLocation) throw new Error(label + ": expected redirect, received HTTP " + response.status + ".");
              const next = new URL(nextLocation, current);
              if (next.hostname === auth0Host) return;
              if (next.hostname !== origin.hostname) throw new Error(label + ": unexpected redirect host.");
              current = next;
            }
            throw new Error(label + ": Auth0 was not reached.");
          }
          await reachAuth0(new URL("/protected", origin), "G3 Preview");
          console.log("PASS_G3_VERCEL_TRUSTED_SOURCE_POSITIVE_CONTROL");
          NODE

      - name: Execute trusted PR128 Auth0/RBAC grant, deny, revoke, cleanup and rollback suite
        shell: bash
        env:
          NEON_RBAC_PR128_TEST_OWNER_DATABASE_URL: ${{ secrets.NEON_RBAC_PR128_TEST_OWNER_DATABASE_URL }}
          AUTH0_E2E_USERNAME: ${{ secrets.AUTH0_E2E_USERNAME }}
          AUTH0_E2E_PASSWORD: ${{ secrets.AUTH0_E2E_PASSWORD }}
        run: |
          set -euo pipefail
          NODE_PATH="${RUNNER_TEMP}/g3/node_modules" \
            "${RUNNER_TEMP}/g3/node_modules/.bin/playwright" test \
            --config=.github/trusted/g3-pr128.playwright.config.cjs
