name: IAM G1 disposable child credential rotation offline contracts

on:
  pull_request:
    paths:
      - ".github/scripts/iam-g1-child-owner-rotate-and-sync.py"
      - ".github/tests/test-iam-g1-child-owner-rotate-and-sync.py"
      - ".github/workflows/iam-g1-child-rotate-sync-contracts.yml"
  push:
    branches:
      - ops/iam-g1-child-owner-rotate-and-sync-20261115
    paths:
      - ".github/scripts/iam-g1-child-owner-rotate-and-sync.py"
      - ".github/tests/test-iam-g1-child-owner-rotate-and-sync.py"
      - ".github/workflows/iam-g1-child-rotate-sync-contracts.yml"

permissions:
  contents: read

jobs:
  synthetic-rotation-sync-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout no credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Offline tests - no Neon or GitHub tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tests/test-iam-g1-child-owner-rotate-and-sync.py
          python3 -m py_compile .github/scripts/iam-g1-child-owner-rotate-and-sync.py
          echo "PASS_G1_DISPOSABLE_CHILD_ROTATE_SYNC_OFFLINE_ONLY"
