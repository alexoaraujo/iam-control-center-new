name: Neon review branch - runtime role verification

on:
  workflow_dispatch:
    inputs:
      confirm_review_branch:
        description: "Verify the approved disposable review database"
        required: true
        type: choice
        options:
          - 'NO'
          - RUN_REVIEW_CHECK

permissions:
  contents: read

concurrency:
  group: neon-review-runtime-role-verification
  cancel-in-progress: false

jobs:
  verify-runtime-role:
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.ref == 'refs/heads/main' && inputs.confirm_review_branch == 'RUN_REVIEW_CHECK'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: neon-review-maintenance
    env:
      NEON_REVIEW_BRANCH_ID: ${{ vars.NEON_REVIEW_BRANCH_ID }}
      NEON_REVIEW_DATABASE: ${{ vars.NEON_REVIEW_DATABASE }}
    steps:
      - name: Check out the dispatched main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check approved target and expiry
        run: node scripts/neon-review-target.mjs --preflight
      - name: Prepare PostgreSQL 18 client and system CA roots
        run: docker build --pull -f database/tests/fixtures/pg18-system-ca.Dockerfile -t iam-neon-review-client database/tests/fixtures
      - name: Verify authenticated Neon identity, runtime privileges and forced RLS
        env:
          NEON_REVIEW_DATABASE_URL: ${{ secrets.NEON_REVIEW_DATABASE_URL }}
        run: node scripts/neon-review-target.mjs --verify
