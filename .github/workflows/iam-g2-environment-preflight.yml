name: G2 protected Environment metadata preflight
on:
  pull_request:
    paths:
      - '.github/scripts/iam-g2-environment-preflight.py'
      - '.github/tests/test-iam-g2-environment-preflight.py'
      - '.github/workflows/iam-g2-environment-preflight.yml'
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact reviewed main SHA (metadata audit only)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  offline-preflight-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 .github/tests/test-iam-g2-environment-preflight.py -v
  metadata-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'alexoaraujo/iam-control-center-new'
    needs: offline-preflight-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read protection and inventory metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          umask 077
          python3 .github/scripts/iam-g2-environment-preflight.py "$APPROVED_SHA"
