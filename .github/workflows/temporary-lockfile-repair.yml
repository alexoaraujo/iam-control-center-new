name: Temporary lockfile repair

on:
  push:
    branches:
      - feat/auth0-nextjs-sdk-integration

permissions:
  contents: write

concurrency:
  group: temporary-lockfile-repair
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - name: Regenerate lockfile with project package manifests
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches package manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: regenerate pnpm lockfile for Auth0 SDK"
          git push origin HEAD:${{ github.ref_name }}
