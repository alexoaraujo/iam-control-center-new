name: R1 lockfile commit (temporary)

on:
  push:
    branches:
      - fix/r1-node-types-24-lock-refresh
    paths:
      - .github/workflows/r1-lockfile-commit.yml
      - apps/web/package.json

permissions:
  contents: write

jobs:
  regenerate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: fix/r1-node-types-24-lock-refresh
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'fix(types): regenerate lockfile for Node 24 types'
            git push origin HEAD:fix/r1-node-types-24-lock-refresh
          fi
