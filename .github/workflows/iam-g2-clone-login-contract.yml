name: G2 clone direct login offline contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'database/scripts/g2-clone-direct-login.py'
      - 'database/tests/test-g2-clone-direct-login.py'
      - '.github/workflows/iam-g2-clone-login-contract.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 -B database/tests/test-g2-clone-direct-login.py -v
