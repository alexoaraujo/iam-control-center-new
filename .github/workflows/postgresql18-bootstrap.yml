name: PostgreSQL 18 bootstrap proposal

on:
  pull_request:
    paths:
      - ".github/workflows/postgresql18-bootstrap.yml"
      - "database/bootstrap/**"
      - "scripts/test-postgres18-bootstrap.sh"

permissions:
  contents: read

jobs:
  bootstrap-security:
    name: postgresql18-bootstrap-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Run PostgreSQL 18 role and privilege tests
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/test-postgres18-bootstrap.sh
