name: Temporary dependency lock refresh
on:
  push:
    branches:
      - security/nextjs-react-patch
permissions:
  contents: write
concurrency:
  group: security-lock-refresh
  cancel-in-progress: true
jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: security/nextjs-react-patch
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.12.1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Regenerate lockfile with pinned pnpm
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit
        shell: bash
        run: |
          set +e
          pnpm audit --prod
          audit_status=$?
          echo "pnpm audit exit code: $audit_status"
          echo "Audit is recorded separately from lint/typecheck/test/build; inspect findings before merge."
          exit 0
      - name: Commit regenerated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged; nothing to commit."
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "chore(security): regenerate pnpm lockfile"
          git push origin HEAD:security/nextjs-react-patch
