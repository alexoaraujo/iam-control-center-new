name: Auth0 Management existing users dry-run (read-only)

# Explicitly restricted to the reviewed PR #42 branch and protected environment.
# No pull_request, schedule, user exports, artifacts or database operations.
on:
  push:
    branches:
      - feat/auth0-neon-identity-sync-20261111
    paths:
      - .github/workflows/auth0-existing-users-dry-run.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth0-existing-users-readonly-audit
  cancel-in-progress: false

jobs:
  scan-auth0-users:
    name: Read-only Auth0 population fingerprint (no SQL)
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.ref == 'refs/heads/feat/auth0-neon-identity-sync-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: IAM-Audit-Development
    env:
      AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
      AUTH0_MGMT_CLIENT_ID: ${{ secrets.AUTH0_MGMT_CLIENT_ID }}
      AUTH0_MGMT_CLIENT_SECRET: ${{ secrets.AUTH0_MGMT_CLIENT_SECRET }}
    steps:
      - name: Checkout reviewed PR #42 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate read-only source population (max 999 identities)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/auth0-existing-users-dry-run.mjs --dry-run

      - name: Record immutable run context without revealing subjects
        if: success()
        shell: bash
        run: |
          echo "PASS: read-only Auth0 snapshot; run=${GITHUB_RUN_ID}; sha=${GITHUB_SHA}; environment=IAM-Audit-Development; no Neon writes"
