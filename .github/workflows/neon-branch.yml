name: Neon PR Branch Lifecycle

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}

# Serialize all PR branch preflights so concurrent PRs cannot race the shared root-branch quota check.
concurrency:
  group: neon-pr-branch-lifecycle
  cancel-in-progress: false

jobs:
  create_preview_branch:
    name: Create isolated schema-only Neon branch
    # Safety hold: keep disabled until review approves lifecycle behavior and exact-SHA CI evidence is green.
    if: false && vars.NEON_PR_BRANCH_LIFECYCLE_ENABLED == 'true' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate Neon configuration
        shell: bash
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${NEON_PROJECT_ID//[[:space:]]/}" ]] || { echo "::error::NEON_PROJECT_ID is not configured"; exit 1; }
          [[ -n "${NEON_API_KEY//[[:space:]]/}" ]] || { echo "::error::NEON_API_KEY is not configured"; exit 1; }

      - name: Calculate branch expiration
        id: expiration
        shell: bash
        run: echo "expires_at=$(date -u --date='+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Check Neon root-branch capacity
        id: capacity
        shell: bash
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/neon-branch-lifecycle.mjs create

      - name: Create schema-only Neon branch
        id: create_neon_branch
        if: steps.capacity.outputs.should_create == 'true'
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          parent_branch: production
          branch_type: schema-only
          expires_at: ${{ steps.expiration.outputs.expires_at }}

  delete_preview_branch:
    name: Delete Neon PR branch
    # Safety hold: cleanup remains disabled until review approves lifecycle behavior and exact-SHA CI evidence is green.
    if: false && vars.NEON_PR_BRANCH_LIFECYCLE_ENABLED == 'true' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate Neon configuration
        shell: bash
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${NEON_PROJECT_ID//[[:space:]]/}" ]] || { echo "::error::NEON_PROJECT_ID is not configured"; exit 1; }
          [[ -n "${NEON_API_KEY//[[:space:]]/}" ]] || { echo "::error::NEON_API_KEY is not configured"; exit 1; }

      - name: Check whether the exact preview branch exists
        id: preview
        shell: bash
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/neon-branch-lifecycle.mjs delete

      - name: Delete Neon PR branch
        if: steps.preview.outputs.exists == 'true'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/pr-${{ github.event.pull_request.number }}
