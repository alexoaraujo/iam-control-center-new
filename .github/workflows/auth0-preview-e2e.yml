name: Auth0 Preview E2E

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact HTTPS URL of this branch's Vercel Preview deployment (never Production)
        required: true
        type: string
      test_user:
        description: Auth0 test account email
        required: true
        default: teste@teste.com
        type: string

permissions:
  contents: read

concurrency:
  group: auth0-preview-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth0-preview-e2e:
    name: auth0-preview-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Preview
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate target is an isolated Vercel Preview
        id: target
        env:
          PREVIEW_URL_INPUT: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const value = process.env.PREVIEW_URL_INPUT;
          const url = new URL(value);
          const allowedHost = url.hostname.endsWith("-alexoaraujo83-8387s-projects.vercel.app")
            && url.hostname.startsWith("iam-control-center-")
            && url.hostname !== "iam-control-center.vercel.app";
          if (url.protocol !== "https:" || !allowedHost || url.pathname !== "/" || url.search || url.hash) {
            throw new Error("Target must be the exact isolated IAM Control Center Vercel Preview origin.");
          }
          process.stdout.write(`PREVIEW_URL=${url.origin}\n`);
          NODE
          echo "url=$(node -e 'process.stdout.write(new URL(process.env.PREVIEW_URL_INPUT).origin)')" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned Playwright runner
        working-directory: apps/web
        run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Auth0 Preview E2E
        working-directory: apps/web
        env:
          CI: "true"
          PREVIEW_URL: ${{ steps.target.outputs.url }}
          IAM_TEST_USER: ${{ inputs.test_user }}
          IAM_TEST_USER_PASSWORD: ${{ secrets.IAM_TEST_USER_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${IAM_TEST_USER_PASSWORD}" ]; then
            echo "::error::IAM_TEST_USER_PASSWORD is not available in the Preview environment."
            exit 1
          fi
          npx playwright test --config=playwright.config.ts

      - name: Record non-sensitive execution metadata
        if: always()
        env:
          PREVIEW_URL: ${{ steps.target.outputs.url }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            echo "## Auth0 Preview E2E"
            echo "- Commit SHA: `$COMMIT_SHA`"
            echo "- Run ID: `$RUN_ID` (attempt `$RUN_ATTEMPT`)"
            echo "- Preview: `$PREVIEW_URL`"
            echo "- Credential values, cookies, tokens and browser traces: not recorded."
          } >> "$GITHUB_STEP_SUMMARY"
