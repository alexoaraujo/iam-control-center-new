name: Auth0 Preview E2E

on:
  push:
    branches:
      - test/auth0-playwright-preview-e2e
  pull_request:
    branches:
      - fix/production-auth-runtime-diagnostics
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact HTTPS URL of this branch's Vercel Preview deployment (never Production)
        required: true
        type: string
      test_user:
        description: Auth0 test account email
        required: true
        default: teste@teste.com
        type: string

permissions:
  contents: read
  statuses: read

concurrency:
  group: auth0-preview-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth0-preview-e2e:
    name: auth0-preview-e2e
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'test/auth0-playwright-preview-e2e'
      ) ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/test/auth0-playwright-preview-e2e'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Preview
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate isolated Preview target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIEW_URL_INPUT: ${{ inputs.preview_url }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            candidate="$PREVIEW_URL_INPUT"
          else
            candidate="https://iam-control-center-preview.vercel.app"
          fi
          node - "$candidate" <<'NODE' >> "$GITHUB_OUTPUT"
          const url = new URL(process.argv[2]);
          const allowedHost = url.hostname === "iam-control-center-preview.vercel.app";
          if (url.protocol !== "https:" || !allowedHost || url.pathname !== "/" || url.search || url.hash) {
            throw new Error("Target must be the verified isolated IAM Control Center Preview alias.");
          }
          process.stdout.write(`url=${url.origin}\n`);
          NODE

      - name: Wait for Vercel Preview of this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            state="$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")] | first | .state // "missing"')"
            if [ "${state}" = "success" ]; then
              echo "Vercel Preview is successful for the exact tested SHA."
              exit 0
            fi
            if [ "${state}" = "failure" ] || [ "${state}" = "error" ]; then
              echo "::error::Vercel Preview failed for the tested SHA."
              exit 1
            fi
            echo "Waiting for Vercel Preview (attempt ${attempt}/36)."
            sleep 20
          done
          echo "::error::Timed out waiting for Vercel Preview."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned Playwright runner
        working-directory: apps/web
        run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Auth0 Preview E2E
        working-directory: apps/web
        env:
          CI: "true"
          PREVIEW_URL: ${{ steps.target.outputs.url }}
          IAM_TEST_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_user || 'teste@teste.com' }}
          IAM_TEST_USER_PASSWORD: ${{ secrets.IAM_TEST_USER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${IAM_TEST_USER_PASSWORD}" ]; then
            echo "::error::IAM_TEST_USER_PASSWORD is not available in the Preview environment."
            exit 1
          fi
          if [ -z "${VERCEL_AUTOMATION_BYPASS}" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS is not available in the Preview environment."
            exit 1
          fi
          probe="$(curl --silent --show-error --location --max-redirs 5 --output /dev/null --write-out '%{http_code} %{url_effective}' --header \"x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS}\" \"${PREVIEW_URL}/api/health\")"
          http_status="${probe%% *}"
          effective_url="${probe#* }"
          if [ "${http_status}" != "200" ] || [ "${effective_url}" != "${PREVIEW_URL}/api/health" ]; then
            echo "::error::Vercel Preview bypass check failed (HTTP ${http_status}); verify the current bypass secret in GitHub Environment Preview."
            exit 1
          fi
          echo "Vercel Preview bypass preflight passed for the verified alias."
          npx playwright test --config=playwright.config.ts

      - name: Record non-sensitive execution metadata
        if: always()
        env:
          PREVIEW_URL: ${{ steps.target.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            echo "## Auth0 Preview E2E"
            printf '%s\n' "- Commit SHA: \`$COMMIT_SHA\`"
            printf '%s\n' "- Run ID: \`$RUN_ID\` (attempt \`$RUN_ATTEMPT\`)"
            printf '%s\n' "- Preview: \`$PREVIEW_URL\`"
            echo "- Credential values, cookies, tokens and browser traces: not recorded."
          } >> "$GITHUB_STEP_SUMMARY"
