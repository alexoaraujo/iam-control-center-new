name: CI

# Run exactly once for each PR head plus every main push. Other branches can
# opt in via workflow_dispatch without duplicating PR CI on every branch push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Newer PR commits supersede stale PR tests; a main push is never canceled.
# This avoids duplicate jobs and keeps the required check bound to the latest SHA.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      preview_required: ${{ steps.preview-impact.outputs.preview_required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Bun is a pinned TEST TOOLCHAIN, installed only after mandatory SCA,
      # lint and strict TypeScript have passed. It does not ship to Next.js.
      - name: Install pinned Bun 1.4.4 for unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-fund bun@1.4.4
          test "$(bun --version)" = "1.4.4"

      - name: Test
        run: pnpm test

      - name: Test Preview build and Auth0 configuration contracts
        run: node --test scripts/*.test.mjs

      - name: Determine whether a Preview deployment is required
        id: preview-impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/vercel-ignore-build.mjs --github-output

      # The Auth0 SDK is evaluated during CI build. These values are inert,
      # scoped only to this step, and never used in Preview or Production.
      - name: Build
        env:
          AUTH0_DOMAIN: ci-only.invalid
          AUTH0_CLIENT_ID: ci-build-only
          AUTH0_CLIENT_SECRET: ci-build-only-not-a-credential
          AUTH0_SECRET: ci-build-only-secret-not-valid-for-any-environment
          APP_BASE_URL: http://localhost:3000
        run: pnpm build

  preview-deployment:
    name: preview-deployment
    if: github.event_name == 'pull_request' && needs.quality.outputs.preview_required == 'true'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      preview_host: ${{ steps.resolve-preview.outputs.preview_host }}
    # Read-only Vercel status lookup: never use the secret-bearing Preview Environment.
    # The protected Preview environment remains mandatory for Auth0 sync and E2E.
    permissions:
      contents: read
      statuses: read
      checks: read
    steps:
      - name: Wait for an exact-SHA READY Vercel Preview deployment
        id: resolve-preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            state="$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")] | first | .state // "missing"')"
            if [ "${state}" = "failure" ] || [ "${state}" = "error" ]; then
              echo "::error::Vercel reported ${state} for ${COMMIT_SHA}."
              exit 1
            fi

            checks="$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100")"
            preview_host="$(jq -er --arg sha "${COMMIT_SHA}" '
              [ .check_runs[]
                | select(
                    .head_sha == $sha
                    and .app.slug == "vercel"
                    and .name == "Vercel Preview Comments"
                    and .conclusion == "success"
                  )
                | (.output.summary // "")
                | try (capture("https://vercel\\.live/open-feedback/(?<host>[^/?#]+)").host) catch empty
              ]
              | unique
              | if length == 1 then .[0] else empty end
            ' <<< "${checks}" 2>/dev/null || true)"

            if [ "${state}" = "success" ] && [ -n "${preview_host}" ]; then
              case "${preview_host}" in
                *.vercel.app)
                  [[ "${preview_host}" =~ ^[a-zA-Z0-9-]+\.vercel\.app$ ]] || exit 1
                  printf 'preview_host=%s\n' "${preview_host}" >> "$GITHUB_OUTPUT"
                  echo "Exact-SHA Vercel Preview is ready: ${preview_host}"
                  exit 0
                  ;;
                *)
                  echo "::error::Vercel returned a non-deployment hostname for ${COMMIT_SHA}."
                  exit 1
                  ;;
              esac
            fi

            echo "Waiting for exact-SHA Vercel Preview (attempt ${attempt}/36); status: ${state}; deployment URL: ${preview_host:-missing}."
            sleep 20
          done
          echo "::error::No exact-SHA READY Vercel Preview deployment was found for ${COMMIT_SHA}."
          exit 1

  sync-auth0-preview:
    name: sync-auth0-preview
    # Only validated Auth0 callback branches can receive browser credentials.
    if: github.event_name == 'pull_request' && vars.AUTH0_E2E_ENABLED == 'true' && needs.quality.outputs.preview_required == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - quality
      - preview-deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: Preview
    permissions:
      contents: read
    outputs:
      auth0_ready: ${{ steps.sync.outputs.auth0_ready }}
      scope: ${{ steps.sync.outputs.scope }}
      callback_host: ${{ steps.sync.outputs.callback_host }}
      callback_branch: ${{ steps.sync.outputs.callback_branch }}
      app_base_url: ${{ steps.sync.outputs.app_base_url }}
      auth0_domain: ${{ steps.sync.outputs.auth0_domain }}
    steps:
      - name: Checkout full PR history for reliable file-scope detection
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Synchronize Auth0 and Vercel Preview settings before E2E binding
        id: sync
        env:
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          E2E_DEPLOYMENT_HOST: ${{ needs.preview-deployment.outputs.preview_host }}
          VERCEL_TEAM_SLUG: aoa4
          VERCEL_PROJECT_ID: prj_OnuwD1iarOsXh6FFGkSpK4A5mj80
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: node scripts/sync-auth0-e2e-preview.mjs

  auth0-e2e:
    name: auth0-e2e
    # Always schedule E2E when a Preview is required and E2E is enabled.
    # Unsupported branches/forks fail closed in the binding preflight rather than
    # silently reporting CI green with auth0-e2e SKIPPED.
    if: github.event_name == 'pull_request' && vars.AUTH0_E2E_ENABLED == 'true' && needs.quality.outputs.preview_required == 'true' && needs.sync-auth0-preview.outputs.auth0_ready == 'true'
    needs:
      - quality
      - preview-deployment
      - sync-auth0-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Must match the GitHub Actions environment configured in Vercel Trusted Sources.
    # Without this, GitHub issues a ref-based OIDC subject instead of environment:Preview.
    environment:
      name: Preview
    permissions:
      contents: read
      checks: read
      statuses: read
      id-token: write
    env:
      AUTH0_E2E_USERNAME: ${{ secrets.AUTH0_E2E_USERNAME }}
      AUTH0_E2E_PASSWORD: ${{ secrets.AUTH0_E2E_PASSWORD }}
      # Reviewed Auth0 user digest; never store the raw subject in the workflow.
      AUTH0_E2E_EXPECTED_SUB_SHA256: e8cd8b1bf515f595a4531fb01ed6ae3d42c8929d28a50416759789376423a9f0
      # Preview-only session-expiry regression control.
      AUTH0_E2E_SESSION_ABSOLUTE_SECONDS: '45'
      # Positive write E2E is limited to isolated PR42 Preview.
      E2E_IDENTITY_SYNC: ${{ github.event.pull_request.head.ref == 'feat/auth0-neon-identity-sync-20261111' && 'true' || 'false' }}
      # Fixed user-approved callback alias. Branch is derived from the verified
      # Vercel project-domain binding for each run, never from a stale fallback.
      E2E_CALLBACK_HOST: ${{ needs.sync-auth0-preview.outputs.callback_host }}
      E2E_CALLBACK_BRANCH: ${{ needs.sync-auth0-preview.outputs.callback_branch }}
      APP_BASE_URL: ${{ needs.sync-auth0-preview.outputs.app_base_url }}
      AUTH0_DOMAIN: ${{ needs.sync-auth0-preview.outputs.auth0_domain }}
      # Preview-only branch-scoped SQL connection is injected solely in E2E step.
      E2E_RBAC_HTTP_ENABLED: ${{ github.event.pull_request.head.ref == 'feat/iam-api-rbac-lineage-20261110' && 'true' || 'false' }}
      E2E_RBAC_PROJECT_ID: tiny-rice-70320263
      E2E_RBAC_BRANCH_ID: br-quiet-night-b6cfeq4j
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TEAM_SLUG: aoa4
      VERCEL_PROJECT_ID: prj_OnuwD1iarOsXh6FFGkSpK4A5mj80
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24


      - name: Bind E2E to the verified Preview and callback branch
        env:
          E2E_DEPLOYMENT_HOST: ${{ needs.preview-deployment.outputs.preview_host }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${AUTH0_E2E_USERNAME:-}" || -z "${AUTH0_E2E_PASSWORD:-}" ]]; then
            echo "::error::AUTH0_E2E_USERNAME and AUTH0_E2E_PASSWORD must be set in the protected Preview environment."
            exit 1
          fi
          node scripts/bind-e2e-preview.mjs

      - name: Install isolated Playwright runner
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --save-exact --no-audit --no-fund @playwright/test@1.64.1 @neondatabase/serverless@1.2.0
          npm audit --audit-level=high

      - name: Install Chromium
        run: "$RUNNER_TEMP/playwright/node_modules/.bin/playwright install --with-deps chromium"

      - name: Request Vercel Trusted Source OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --get \
            --data-urlencode "audience=https://github.com/alexoaraujo" \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(jq -er '.value | select(type == "string" and length > 0)' <<< "$response")"
          echo "::add-mask::${token}"
          printf 'VERCEL_TRUSTED_OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          unset token response

      - name: Verify GitHub OIDC claims for Vercel Trusted Sources
        run: |
          node <<'NODE'
          const token = process.env.VERCEL_TRUSTED_OIDC_TOKEN;
          if (!token) throw new Error("OIDC token missing from job environment.");
          const parts = token.split(".");
          if (parts.length !== 3) throw new Error("OIDC token is not a JWT.");
          const claims = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
          const expectedIssuer = "https://token.actions.githubusercontent.com";
          // GitHub's OIDC subject for this repository includes immutable owner/repository IDs.
          const expectedSubject = "repo:alexoaraujo@325264809/iam-control-center-new@1451861889:environment:Preview";
          const audience = Array.isArray(claims.aud) ? claims.aud : [claims.aud];
          // These claims are non-secret diagnostics; never print or persist the JWT.
          console.log(JSON.stringify({
            issuer: claims.iss ?? null,
            audience,
            subject: claims.sub ?? null,
            repository: claims.repository ?? null,
            ref: claims.ref ?? null,
            environment: claims.environment ?? null,
            event_name: claims.event_name ?? null,
            issued_at: claims.iat ?? null,
            expires_at: claims.exp ?? null,
            token_age_seconds: Number.isFinite(claims.iat) ? Math.floor(Date.now() / 1000) - claims.iat : null,
            seconds_until_expiry: Number.isFinite(claims.exp) ? claims.exp - Math.floor(Date.now() / 1000) : null,
          }));
          const now = Math.floor(Date.now() / 1000);
          if (!Number.isFinite(claims.iat) || !Number.isFinite(claims.exp)) throw new Error("OIDC token is missing iat/exp claims.");
          if (claims.iat > now + 60 || claims.exp <= now) throw new Error("OIDC token is not currently valid.");
          if (claims.iss !== expectedIssuer) throw new Error("Unexpected OIDC issuer.");
          if (!audience.includes("https://github.com/alexoaraujo")) throw new Error("Unexpected OIDC audience.");
          if (claims.sub !== expectedSubject) throw new Error("OIDC subject does not match GitHub environment Preview.");
          NODE

      - name: Verify callback and Preview are the same exact-SHA deployment
        env:
          E2E_DEPLOYMENT_HOST: ${{ needs.preview-deployment.outputs.preview_host }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/verify-preview-alias.mjs

      - name: Preflight Vercel Deployment Protection (negative and positive controls)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const deploymentOrigin = new URL(process.env.E2E_DEPLOYMENT_URL);
          const token = process.env.VERCEL_TRUSTED_OIDC_TOKEN;
          const callbackHost = process.env.E2E_CALLBACK_HOST;
          const trustedHeader = "x-vercel-trusted-oidc-idp-token";
          const auth0Host = "iam-control-center.us.auth0.com";
          const trustedHosts = new Set([deploymentOrigin.hostname, callbackHost]);

          if (!token) throw new Error("Vercel Trusted Sources OIDC token is missing.");
          if (!/^iam-control-center-new-[a-z0-9-]+\.vercel\.app$/.test(callbackHost) ||
              callbackHost !== deploymentOrigin.hostname) {
            throw new Error("Callback must be the reviewed IAM Preview alias for this exact-SHA deployment.");
          }
          // A shared deployment/callback hostname is permitted when the exact-SHA
          // Preview gate already verified that hostname for this PR commit.

          // Negative control: deployment hostname must be protected without OIDC.
          const anonymous = await fetch(new URL("/protected", deploymentOrigin), { redirect: "manual" });
          const anonymousLocation = anonymous.headers.get("location");
          const intercepted = anonymous.status === 401 || anonymous.status === 403 ||
            (anonymousLocation && new URL(anonymousLocation, deploymentOrigin).hostname === "vercel.com");
          if (!intercepted) {
            throw new Error(`Negative control failed: HTTP ${anonymous.status}, Location ${anonymousLocation ?? "none"}.`);
          }
          console.log(`Negative control passed: ${deploymentOrigin.hostname} blocks access without OIDC.`);

          // Follow only same-Preview-host redirects until Auth0. Attach the
          // trusted token only to the two explicit Preview hosts, never Auth0.
          async function reachAuth0(start, label) {
            let current = new URL(start);
            for (let attempt = 0; attempt < 6; attempt += 1) {
              if (!trustedHosts.has(current.hostname)) {
                throw new Error(`Refusing to send OIDC token to untrusted host ${current.hostname}.`);
              }
              const response = await fetch(current, {
                redirect: "manual",
                headers: { [trustedHeader]: token },
              });
              const location = response.headers.get("location");
              if (!location) {
                throw new Error(`${label}: expected redirect from ${current.pathname}; HTTP ${response.status}, no Location.`);
              }
              const next = new URL(location, current);
              if (next.hostname === auth0Host) {
                console.log(`${label} passed: reached Auth0 after ${attempt + 1} Preview redirect(s).`);
                return;
              }
              if (next.hostname === "vercel.com") {
                throw new Error(`${label}: Vercel Deployment Protection intercepted a request carrying the OIDC token.`);
              }
              if (!trustedHosts.has(next.hostname)) {
                throw new Error(`${label}: unexpected redirect host ${next.hostname}.`);
              }
              current = next;
            }
            throw new Error(`${label}: did not reach Auth0 within six redirects.`);
          }

          await reachAuth0(new URL("/protected", deploymentOrigin), "Positive control");
          await reachAuth0(new URL("/protected", `https://${callbackHost}`), "Callback alias");
          NODE

      - name: Run Auth0 end-to-end flow
        env:
          # Branch-scoped credential (never Neon API key); only this step can read it.
          NEON_RBAC_TEST_OWNER_DATABASE_URL: ${{ github.event.pull_request.head.ref == 'feat/iam-api-rbac-lineage-20261110' && secrets.NEON_RBAC_TEST_OWNER_DATABASE_URL || '' }}
        run: |
          NODE_PATH="$RUNNER_TEMP/playwright/node_modules" \
            "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" test \
            --config=.github/e2e/playwright.config.cjs

  docs-preview-evidence:
    name: docs-preview-evidence
    # An always-emitted trusted, read-only bridge from the separate docs workflow.
    # No checkout or PR-controlled code executes with the GitHub token.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Verify exact-SHA docs Preview check from its trusted workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          # Forks have no approved Vercel/Auth0 callback and cannot claim a trusted docs exemption.
          [[ "${PR_HEAD_REPOSITORY}" == "${REPOSITORY}" ]] || {
            echo "::error::Docs gate requires a same-repository PR"; exit 1;
          }
          files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          [[ -n "${files}" ]] || { echo "::error::Empty PR change scope"; exit 1; }
          docs_only=true
          while IFS= read -r file; do
            case "${file}" in
              README.md|SECURITY.md|docs/*) ;;
              *) docs_only=false ;;
            esac
          done <<< "${files}"
          if [[ "${docs_only}" != true ]]; then
            echo "NOT_REQUIRED: code/security/SQL changes use exact-SHA Preview and Auth0 E2E instead"
            exit 0
          fi
          # The docs Preview gate lives in another workflow; poll its exact commit check.
          # Never accept a similarly named check from a different workflow or an older SHA.
          for attempt in $(seq 1 "${DOCS_PREVIEW_POLL_ATTEMPTS:-84}"); do
            checks="$(gh api "repos/${REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100")"
            check="$(jq -c --arg sha "${PR_HEAD_SHA}" '
              [.check_runs[] | select(
                .name == "docs-preview-gate" and
                .head_sha == $sha and
                .app.slug == "github-actions"
              )] | sort_by(.id) | last // {}
            ' <<< "${checks}")"
            status="$(jq -r '.status // "missing"' <<< "${check}")"
            conclusion="$(jq -r '.conclusion // "missing"' <<< "${check}")"
            if [[ "${status}" == completed ]]; then
              if [[ "${conclusion}" != success ]]; then
                echo "::error::docs-preview-gate is not SUCCESS for exact SHA: ${conclusion}"
                exit 1
              fi
              details="$(jq -r '.details_url // ""' <<< "${check}")"
              if [[ "${details}" =~ ^https://github\.com/alexoaraujo/iam-control-center-new/actions/runs/([0-9]+)/job/([0-9]+)$ ]]; then
                run_id="${BASH_REMATCH[1]}"
              else
                echo "::error::Docs check has no trusted workflow-run identity"
                exit 1
              fi
              run="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
              jq -e --arg sha "${PR_HEAD_SHA}" '
                .path == ".github/workflows/docs-preview-gate.yml" and
                .head_sha == $sha and
                .event == "pull_request"
              ' <<< "${run}" >/dev/null || {
                echo "::error::SUCCESS check did not come from approved docs workflow and SHA"
                exit 1
              }
              # A job can report success before the entire workflow is terminal.
              # Do not incorrectly fail a legitimate in-progress workflow.
              run_status="$(jq -r '.status // "missing"' <<< "${run}")"
              run_conclusion="$(jq -r '.conclusion // "missing"' <<< "${run}")"
              case "${run_status}" in
                completed)
                  if [[ "${run_conclusion}" != success ]]; then
                    echo "::error::Trusted docs workflow completed without SUCCESS: ${run_conclusion}"
                    exit 1
                  fi
                  echo "PASS: verified docs-preview-gate SUCCESS in trusted workflow at exact SHA"
                  exit 0
                  ;;
                queued|in_progress|pending|waiting|requested)
                  echo "Waiting for trusted docs workflow to finish: ${run_status}"
                  sleep "${DOCS_PREVIEW_POLL_SECONDS:-10}"
                  continue
                  ;;
                *)
                  echo "::error::Unexpected trusted docs workflow status: ${run_status}"
                  exit 1
                  ;;
              esac
            fi
            sleep "${DOCS_PREVIEW_POLL_SECONDS:-10}"
          done
          echo "::error::Required exact-SHA docs Preview check absent or timed out"
          exit 1

  security-gate:
    name: security-gate
    # A stable, always-emitted status for branch protection. Unlike quality,
    # it incorporates positive E2E and fail-closed Preview contract results.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - quality
      - preview-deployment
      - sync-auth0-preview
      - auth0-e2e
      - docs-preview-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Checkout PR with full history for trusted change-scope assessment
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify PostgreSQL 18 contracts in trusted workflow at exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A separate offline workflow must pass on this exact PR head.
          # Check both the check-run identity and its owning workflow run.
          for attempt in $(seq 1 45); do
            checks="$(gh api "repos/${REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100")"
            check="$(jq -c --arg sha "${PR_HEAD_SHA}" '
              [.check_runs[] | select(
                .name == "pg18-security-contracts" and
                .head_sha == $sha and
                .app.slug == "github-actions"
              )] | sort_by(.id) | last // {}
            ' <<< "${checks}")"
            status="$(jq -r '.status // "missing"' <<< "${check}")"
            conclusion="$(jq -r '.conclusion // "missing"' <<< "${check}")"
            if [[ "${status}" == completed ]]; then
              [[ "${conclusion}" == success ]] || {
                echo "::error::Exact-SHA PG18 contract is not SUCCESS: ${conclusion}"
                exit 1
              }
              details="$(jq -r '.details_url // ""' <<< "${check}")"
              if [[ "${details}" =~ ^https://github\.com/alexoaraujo/iam-control-center-new/actions/runs/([0-9]+)/job/([0-9]+)$ ]]; then
                run_id="${BASH_REMATCH[1]}"
              else
                echo "::error::PG18 check is missing its trusted workflow identity"
                exit 1
              fi
              run="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
              jq -e --arg sha "${PR_HEAD_SHA}" '
                .path == ".github/workflows/iam-required-security-gate.yml" and
                .head_sha == $sha and .event == "pull_request"
              ' <<< "${run}" > /dev/null || {
                echo "::error::PG18 check did not originate from the approved workflow/SHA"
                exit 1
              }
              run_status="$(jq -r '.status // "missing"' <<< "${run}")"
              run_conclusion="$(jq -r '.conclusion // "missing"' <<< "${run}")"
              if [[ "${run_status}" == completed ]]; then
                [[ "${run_conclusion}" == success ]] || {
                  echo "::error::PG18 workflow did not finish SUCCESS: ${run_conclusion}"
                  exit 1
                }
                echo "PASS: trusted PostgreSQL 18 contracts verified at exact PR SHA"
                exit 0
              fi
              case "${run_status}" in
                queued|in_progress|pending|waiting|requested) ;;
                *) echo "::error::Unexpected PG18 workflow state: ${run_status}"; exit 1 ;;
              esac
            fi
            sleep 8
          done
          echo "::error::Exact-SHA PostgreSQL 18 security contracts not verified"
          exit 1
      - name: Reject missing security checks or unauthenticated scope exemptions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PREVIEW_REQUIRED: ${{ needs.quality.outputs.preview_required }}
          PREVIEW_RESULT: ${{ needs.preview-deployment.result }}
          SYNC_AUTH0_RESULT: ${{ needs.sync-auth0-preview.result }}
          AUTH0_E2E_RESULT: ${{ needs.auth0-e2e.result }}
          AUTH0_E2E_ENABLED: ${{ vars.AUTH0_E2E_ENABLED }}
          DOCS_PREVIEW_RESULT: ${{ needs.docs-preview-evidence.result }}
        run: node scripts/release-security-gate.mjs
