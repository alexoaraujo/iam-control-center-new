name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Serialize CI per ref without interrupting an active run.
# Note: GitHub concurrency keeps at most one pending run per group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Regenerate lockfile for isolated R1 PR (temporary)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'chore/dependencies-refresh-reconciled'
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Upload regenerated R1 lockfile (temporary)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'chore/dependencies-refresh-reconciled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r1-regenerated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  preview-deployment:
    name: preview-deployment
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: Preview
    permissions:
      contents: read
      statuses: read
      deployments: write
    steps:
      - name: Wait for successful Vercel Preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            state="$(gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/status" --jq '[.statuses[] | select(.context == "Vercel")] | first | .state // "missing"')"
            if [ "${state}" = "success" ]; then
              echo "Vercel status is successful for ${COMMIT_SHA}."
              exit 0
            fi
            if [ "${state}" = "failure" ] || [ "${state}" = "error" ]; then
              echo "::error::Vercel reported ${state} for ${COMMIT_SHA}."
              exit 1
            fi
            echo "Waiting for Vercel status (attempt ${attempt}/36); current state: ${state}."
            sleep 20
          done
          echo "::error::Timed out waiting for a successful Vercel status for ${COMMIT_SHA}."
          exit 1
