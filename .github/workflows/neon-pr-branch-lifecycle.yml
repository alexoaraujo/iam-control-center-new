name: Neon PR branch lifecycle

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# This privileged workflow uses only the event payload and Neon Management API.
# It intentionally does not check out, download, build, or execute PR content.
permissions: {}

concurrency:
  # Fork events receive unique groups and cannot replace a trusted PR's
  # pending lifecycle run in the repository-wide serialization queue.
  group: neon-pr-lifecycle-${{ github.repository }}-${{ github.event.pull_request.head.repo.full_name == github.repository && 'trusted' || github.run_id }}
  cancel-in-progress: false

jobs:
  manage-neon-branch:
    name: Manage isolated Neon branch
    if: >-
      github.repository == vars.IAM_INTEGRATION_REPOSITORY &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: twilight-fire-88497009
      NEON_MAIN_BRANCH_ID: br-little-fire-b6adup9f
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_ACTION: ${{ github.event.action }}
      NEON_API_ROOT: https://console.neon.tech/api/v2

    steps:
      - name: Validate trusted inputs and required configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid pull request number."
            exit 1
          }
          [[ "${NEON_PROJECT_ID}" == "twilight-fire-88497009" ]] || {
            echo "::error::NEON_PROJECT_ID does not match the canonical IAM Control Center Neon project."
            exit 1
          }
          [[ "${NEON_MAIN_BRANCH_ID}" == "br-little-fire-b6adup9f" ]] || {
            echo "::error::NEON_MAIN_BRANCH_ID does not match the canonical main branch."
            exit 1
          }
          [[ -n "${NEON_API_KEY:-}" ]] || {
            echo "::error::NEON_API_KEY secret is not configured."
            exit 1
          }
          case "${PR_ACTION}" in
            opened|reopened|synchronize|closed) ;;
            *) echo "::error::Unsupported pull request action."; exit 1 ;;
          esac
          echo "Validated same-repository PR event; credentials are not displayed."

      - name: Create, reuse, or clean up the PR branch
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          BRANCH_NAME="preview/pr-${PR_NUMBER}"
          BRANCHES_URL="${NEON_API_ROOT}/projects/${NEON_PROJECT_ID}/branches"

          api_get_branches() {
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header "Accept: application/json" \
              "${BRANCHES_URL}?limit=100"
          }

          api_get_branch() {
            local branch_id="$1"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header "Accept: application/json" \
              "${BRANCHES_URL}/${branch_id}"
          }

          BRANCHES_JSON="$(api_get_branches)"
          jq -e '.branches | type == "array"' >/dev/null <<< "${BRANCHES_JSON}"

          # Resolve and validate the canonical default main branch.
          MAIN_JSON="$(jq -ce --arg expected_id "${NEON_MAIN_BRANCH_ID}" '
            [.branches[] | select(.default == true and .name == "main" and .id == $expected_id)] |
            if length == 1 then .[0] else error("Expected exactly one canonical default main branch") end
          ' <<< "${BRANCHES_JSON}")"
          MAIN_ID="$(jq -r '.id' <<< "${MAIN_JSON}")"
          MAIN_STATE="$(jq -r '.current_state // empty' <<< "${MAIN_JSON}")"
          [[ "${MAIN_STATE}" == "ready" ]] || {
            echo "::error::Canonical main branch is not ready."
            exit 1
          }

          # Preserve the canonical permanent lineage: main -> development.
          DEVELOPMENT_JSON="$(jq -ce --arg parent "${MAIN_ID}" '
            [.branches[] | select(.name == "development" and .parent_id == $parent)] |
            if length == 1 then .[0] else error("Expected exactly one development branch whose parent is canonical main") end
          ' <<< "${BRANCHES_JSON}")"
          DEVELOPMENT_ID="$(jq -r '.id' <<< "${DEVELOPMENT_JSON}")"
          DEVELOPMENT_STATE="$(jq -r '.current_state // empty' <<< "${DEVELOPMENT_JSON}")"
          [[ "${DEVELOPMENT_STATE}" == "ready" ]] || {
            echo "::error::Canonical development branch is not ready."
            exit 1
          }

          EXISTING="$(jq -c --arg name "${BRANCH_NAME}" '[.branches[] | select(.name == $name)]' <<< "${BRANCHES_JSON}")"
          EXISTING_COUNT="$(jq -r 'length' <<< "${EXISTING}")"

          OWNERSHIP_KEY="iam-control-center-managed-by"
          OWNERSHIP_VALUE="neon-pr-branch-lifecycle"
          OWNER_PR_KEY="iam-control-center-pr-number"

          if [[ "${PR_ACTION}" == "closed" ]]; then
            # Do not delete by deterministic name/parent alone: a manually
            # created branch could share both. Neon branch provenance is not
            # currently recorded in a verifiable ownership marker.
            echo "PR closed; automatic deletion is disabled because branch provenance cannot be proven."
            echo "Any existing PR branch retains its previously verified 14-day expiration."
            exit 0
          fi

          if [[ "${EXISTING_COUNT}" == "0" ]]; then
            BRANCH_COUNT="$(jq -r '.branches | length' <<< "${BRANCHES_JSON}")"
            if (( BRANCH_COUNT >= 10 )); then
              echo "::error::Neon Free plan branch limit (10) reached; no permanent branch will be removed."
              exit 1
            fi

            EXPIRES_AT="$(date -u -d '+14 days' '+%Y-%m-%dT%H:%M:%SZ')"
            CREATE_BODY="$(jq -cn \
              --arg name "${BRANCH_NAME}" \
              --arg parent "${DEVELOPMENT_ID}" \
              --arg expiry "${EXPIRES_AT}" \
              --arg owner_key "${OWNERSHIP_KEY}" \
              --arg owner_value "${OWNERSHIP_VALUE}" \
              --arg pr_key "${OWNER_PR_KEY}" \
              --arg pr_number "${PR_NUMBER}" \
              '{branch:{name:$name,parent_id:$parent,expires_at:$expiry},annotation_value:{($owner_key):$owner_value,($pr_key):$pr_number}}')"
            CREATE_RESPONSE="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --request POST \
              --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "${CREATE_BODY}" \
              "${BRANCHES_URL}")"
            CREATED_ID="$(jq -r '.branch.id // empty' <<< "${CREATE_RESPONSE}")"
            [[ -n "${CREATED_ID}" ]] || {
              echo "::error::Neon did not return the created branch ID."
              exit 1
            }
            echo "Created temporary branch with an initial 14-day TTL and ownership annotation; no compute endpoint was provisioned."
          else
            [[ "${EXISTING_COUNT}" == "1" ]] || {
              echo "::error::More than one branch matched the exact PR branch name."
              exit 1
            }
            CREATED_ID="$(jq -r '.[0].id' <<< "${EXISTING}")"
            EXISTING_PARENT="$(jq -r '.[0].parent_id // empty' <<< "${EXISTING}")"
            [[ "${EXISTING_PARENT}" == "${DEVELOPMENT_ID}" ]] || {
              echo "::error::Existing branch has an unexpected parent; refusing to reuse or replace it."
              exit 1
            }
            EXISTING_DETAILS="$(api_get_branch "${CREATED_ID}")"
            EXISTING_OWNER="$(jq -r --arg key "${OWNERSHIP_KEY}" '.annotation.value[$key] // empty' <<< "${EXISTING_DETAILS}")"
            EXISTING_PR="$(jq -r --arg key "${OWNER_PR_KEY}" '.annotation.value[$key] // empty' <<< "${EXISTING_DETAILS}")"
            [[ "${EXISTING_OWNER}" == "${OWNERSHIP_VALUE}" && "${EXISTING_PR}" == "${PR_NUMBER}" ]] || {
              echo "::error::Existing branch lacks the exact lifecycle ownership annotation; refusing reuse or TTL changes."
              exit 1
            }
            echo "Reusing the previously annotated branch owned by this lifecycle workflow."
          fi

          # Wait for Neon to finish provisioning before applying the 14-day TTL.
          READY="false"
          for attempt in $(seq 1 36); do
            CURRENT="$(api_get_branch "${CREATED_ID}")"
            CURRENT_STATE="$(jq -r '.branch.current_state // empty' <<< "${CURRENT}")"
            CURRENT_PARENT="$(jq -r '.branch.parent_id // empty' <<< "${CURRENT}")"
            [[ "${CURRENT_PARENT}" == "${DEVELOPMENT_ID}" ]] || {
              echo "::error::Branch parent changed during provisioning."
              exit 1
            }
            if [[ "${CURRENT_STATE}" == "ready" ]]; then
              READY="true"
              break
            fi
            echo "Waiting for Neon branch readiness (attempt ${attempt}/36)."
            sleep 10
          done
          [[ "${READY}" == "true" ]] || {
            echo "::error::Neon branch did not reach ready state within six minutes."
            exit 1
          }

          EXPIRES_AT="${EXPIRES_AT:-$(date -u -d '+14 days' '+%Y-%m-%dT%H:%M:%SZ')}"
          PATCH_BODY="$(jq -cn --arg expiry "${EXPIRES_AT}" '{branch:{expires_at:$expiry}}')"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --request PATCH \
            --header "Authorization: Bearer ${NEON_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "${PATCH_BODY}" \
            "${BRANCHES_URL}/${CREATED_ID}" >/dev/null

          VERIFIED="$(api_get_branch "${CREATED_ID}")"
          VERIFIED_NAME="$(jq -r '.branch.name // empty' <<< "${VERIFIED}")"
          VERIFIED_PARENT="$(jq -r '.branch.parent_id // empty' <<< "${VERIFIED}")"
          VERIFIED_EXPIRY="$(jq -r '.branch.expires_at // empty' <<< "${VERIFIED}")"
          VERIFIED_EXPIRY_EPOCH="$(date -u -d "${VERIFIED_EXPIRY}" '+%s' 2>/dev/null || true)"
          EXPECTED_EXPIRY_EPOCH="$(date -u -d "${EXPIRES_AT}" '+%s')"
          [[ "${VERIFIED_NAME}" == "${BRANCH_NAME}" && "${VERIFIED_PARENT}" == "${DEVELOPMENT_ID}" && "${VERIFIED_EXPIRY_EPOCH}" =~ ^[0-9]+$ ]] || {
            echo "::error::Branch identity, parent, or expiration verification failed."
            exit 1
          }
          if (( VERIFIED_EXPIRY_EPOCH < EXPECTED_EXPIRY_EPOCH - 60 || VERIFIED_EXPIRY_EPOCH > EXPECTED_EXPIRY_EPOCH + 60 )); then
            echo "::error::Neon expiration does not match the requested 14-day TTL."
            exit 1
          fi
          echo "PR branch is ready, parent-verified, and its 14-day expiration matches the requested timestamp."
          echo "No database migration or compute endpoint was provisioned."
