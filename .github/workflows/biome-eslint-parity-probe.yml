name: Temporary ESLint-to-Biome parity proof
on:
  pull_request:
    paths:
      - "scripts/biome-negative-rules.test.mjs"
      - ".github/workflows/biome-eslint-parity-probe.yml"
      - "apps/web/biome.json"
permissions:
  contents: read
jobs:
  baseline-eslint-inventory:
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/biome-lint-no-picomatch-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted baseline only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: 17a4e86fddecc02c4326049fdf3d95fea6f4e522
          path: baseline
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Resolve effective ESLint config from frozen main baseline
        shell: bash
        run: |
          set -euo pipefail
          cd baseline
          pnpm install --frozen-lockfile --ignore-scripts
          cd apps/web
          ./node_modules/.bin/eslint --print-config src/app/page.tsx > "$RUNNER_TEMP/iam-eslint-baseline.json"
          node - "$RUNNER_TEMP/iam-eslint-baseline.json" <<'NODE'
          const fs = require("node:fs");
          const conf = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const rules = Object.entries(conf.rules ?? {}).filter(([,value]) => {
            const severity = Array.isArray(value) ? value[0] : value;
            return severity !== 0 && severity !== "off";
          });
          console.log("PEOS_ESLINT_BASELINE_SHA=17a4e86fddecc02c4326049fdf3d95fea6f4e522");
          console.log("PEOS_ESLINT_EFFECTIVE_ENABLED_COUNT=" + rules.length);
          const prefixes = ["@next/next/", "react-hooks/", "jsx-a11y/", "@typescript-eslint/", "react/", "import/"];
          const builtin = rules.filter(([name]) => !prefixes.some(prefix => name.startsWith(prefix)));
          console.log("PEOS_RULE_GROUP=ESLINT_CORE COUNT=" + builtin.length);
          for (const [name,value] of builtin.sort(([a],[b]) => a.localeCompare(b))) {
            const severity = Array.isArray(value) ? value[0] : value;
            console.log("PEOS_ESLINT_RULE=" + name + " SEVERITY=" + severity);
          }
          for (const prefix of prefixes) {
            const group = rules.filter(([name]) => name.startsWith(prefix)).sort(([a],[b]) => a.localeCompare(b));
            console.log("PEOS_RULE_GROUP=" + prefix + " COUNT=" + group.length);
            for (const [name,value] of group) {
              const severity = Array.isArray(value) ? value[0] : value;
              console.log("PEOS_ESLINT_RULE=" + name + " SEVERITY=" + severity);
            }
          }
          NODE

  biome-negative-contracts:
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/biome-lint-no-picomatch-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout PR without write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Execute negative lint rules without suppressing warnings
        run: node --test scripts/biome-negative-rules.test.mjs
