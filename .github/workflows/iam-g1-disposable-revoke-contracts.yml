name: IAM G1 disposable revoker offline contracts

on:
  push:
    branches:
      - security/iam-g1-disposable-revoker-20261115
    paths:
      - ".github/scripts/iam-g1-disposable-emergency-revoke.py"
      - ".github/tests/test-iam-g1-disposable-emergency-revoke.py"
      - ".github/workflows/iam-g1-disposable-revoke-contracts.yml"
  pull_request:
    paths:
      - ".github/scripts/iam-g1-disposable-emergency-revoke.py"
      - ".github/tests/test-iam-g1-disposable-emergency-revoke.py"
      - ".github/workflows/iam-g1-disposable-revoke-contracts.yml"

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Unprivileged contract tests, no secrets, no external database
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/iam-g1-disposable-emergency-revoke.py
          python3 .github/tests/test-iam-g1-disposable-emergency-revoke.py
          echo "PASS_G1_DISPOSABLE_REVOKER_OFFLINE_CONTRACTS"
