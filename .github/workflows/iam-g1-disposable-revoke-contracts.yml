name: IAM G1 disposable revoker offline contracts

on:
  push:
    branches:
      - security/iam-g1-disposable-revoker-20261115
    paths:
      - ".github/scripts/iam-g1-disposable-emergency-revoke.py"
      - ".github/tests/test-iam-g1-disposable-emergency-revoke.py"
      - ".github/workflows/iam-g1-disposable-revoke-contracts.yml"
      - ".github/workflows/iam-g1-disposable-emergency-revoke.yml"
      - ".github/scripts/g1-disposable-bin/psql"
      - "database/tests/fixtures/pg18-system-ca.Dockerfile"
      - ".github/scripts/iam-g1-disposable-environment-bootstrap.py"
      - ".github/tests/test-iam-g1-disposable-environment-bootstrap.py"
  pull_request:
    paths:
      - ".github/scripts/iam-g1-disposable-emergency-revoke.py"
      - ".github/tests/test-iam-g1-disposable-emergency-revoke.py"
      - ".github/workflows/iam-g1-disposable-revoke-contracts.yml"
      - ".github/workflows/iam-g1-disposable-emergency-revoke.yml"
      - ".github/scripts/g1-disposable-bin/psql"
      - "database/tests/fixtures/pg18-system-ca.Dockerfile"
      - ".github/scripts/iam-g1-disposable-environment-bootstrap.py"
      - ".github/tests/test-iam-g1-disposable-environment-bootstrap.py"

permissions:
  contents: read

jobs:
  offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Unprivileged contract tests, no secrets, no external database
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/iam-g1-disposable-emergency-revoke.py
          python3 .github/tests/test-iam-g1-disposable-emergency-revoke.py
          python3 .github/tests/test-iam-g1-disposable-environment-bootstrap.py
          echo "PASS_G1_DISPOSABLE_REVOKER_OFFLINE_CONTRACTS"

      - name: Verify dedicated operator client has OS CA and isolated wrapper
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/g1-disposable-bin/psql
          grep -q -- '--network host' .github/scripts/g1-disposable-bin/psql
          grep -q -- '--read-only' .github/scripts/g1-disposable-bin/psql
          grep -q -- '--env PGOPTIONS' .github/scripts/g1-disposable-bin/psql
          grep -q 'iam-g1-pg18-system-ca:local psql' .github/scripts/g1-disposable-bin/psql
          grep -q 'g1-disposable-bin:' .github/workflows/iam-g1-disposable-emergency-revoke.yml
          if grep -Fq 'chmod +x .github/scripts/psql' .github/workflows/iam-g1-disposable-emergency-revoke.yml; then
            echo "::error::BLOCKED_G1_LEGACY_DEVELOPMENT_PSQL_WRAPPER"; exit 2
          fi
          docker build --pull --file database/tests/fixtures/pg18-system-ca.Dockerfile --tag iam-g1-pg18-system-ca:local database/tests/fixtures
          docker run --rm --network none --read-only --entrypoint sh iam-g1-pg18-system-ca:local -ec 'test -s /etc/ssl/certs/ca-certificates.crt && test "$SSL_CERT_FILE" = /etc/ssl/certs/ca-certificates.crt && psql --version | grep -Eq "psql \(PostgreSQL\) 18"'
          grep -q 'PASS_G1_ENV_PROTECTION_REVIEWERS_MAIN' .github/workflows/iam-g1-disposable-emergency-revoke.yml
          grep -q 'and .can_admins_bypass == false' .github/workflows/iam-g1-disposable-emergency-revoke.yml
          grep -q 'BLOCKED_G1_REVOKER_INDEPENDENT_SHA_REVIEW' .github/workflows/iam-g1-disposable-emergency-revoke.yml
          echo "PASS_G1_CA_PROVISIONED_CLIENT_OFFLINE"
