# Temporary, read-only lockfile regeneration job.
# This file is removed from the PR after the generated diff is reviewed.
name: IAM temporary Next.js patch lockfile generation

on:
  pull_request:
    paths:
      - 'apps/web/package.json'
      - '.github/workflows/iam-next-lockfile-generation.yml'

permissions:
  contents: read

jobs:
  pnpm-lockfile-diff:
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.event.pull_request.head.repo.full_name == 'alexoaraujo/iam-control-center-new' && github.event.pull_request.head.ref == 'fix/security-next-16-4-5'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head without persisted token
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Regenerate lockfile without executing install scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --check
          echo 'IAM_NEXT_LOCK_PATCH_BEGIN'
          git diff --no-ext-diff --no-color --unified=3 -- pnpm-lock.yaml
          echo 'IAM_NEXT_LOCK_PATCH_END'
          if ! git diff --quiet -- pnpm-lock.yaml; then
            echo 'LOCKFILE_REGEN_DIFF_READY'
          else
            echo '::error::Expected Next.js lockfile changes'
            exit 2
          fi
