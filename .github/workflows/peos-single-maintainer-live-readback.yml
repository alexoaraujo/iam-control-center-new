name: PEOS single-maintainer live Environment approval readback

on:
  pull_request:
    paths:
      - ".github/scripts/iam-peos-environments-approval-readback.py"
      - ".github/tests/test-iam-peos-environments-approval-readback.py"
      - ".github/workflows/peos-single-maintainer-live-readback.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  peos-environment-approvals-readback:
    if: >-
      github.repository == 'alexoaraujo/iam-control-center-new' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate offline contract with no secrets
        run: python3 .github/tests/test-iam-peos-environments-approval-readback.py
      - name: Check actual Environments without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/iam-peos-environments-approval-readback.py
