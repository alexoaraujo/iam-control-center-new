name: IAM-G1 B2 private encrypted synthetic probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iam-g1-b2-custody-probe
  cancel-in-progress: false

jobs:
  encrypted-upload-probe:
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: IAM-G1-Backup-Custody
    timeout-minutes: 10
    steps:
      - name: Verify B2 public DNS and HTTPS protocol without credentials
        shell: bash
        run: |
          set -euo pipefail
          # No S3 credentials, bucket operations, or Neon access in this probe.
          host="s3.us-east-005.backblazeb2.com"
          if ! getent ahostsv4 "$host" >/dev/null; then
            echo "::error::BLOCKED_B2_PUBLIC_DNS_RESOLUTION"
            exit 2
          fi
          echo "PASS_B2_PUBLIC_DNS"
          if ! http_status="$(curl --http1.1 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 25 --proto '=https' --tlsv1.2 "https://${host}/")"; then
            echo "::error::BLOCKED_B2_PUBLIC_HTTP_PROTOCOL_OR_TLS"
            exit 2
          fi
          if [[ ! "$http_status" =~ ^[234][0-9][0-9]$ ]]; then
            echo "::error::BLOCKED_B2_PUBLIC_HTTP_UNEXPECTED_STATUS: $http_status"
            exit 2
          fi
          # An unauthenticated HTTP 4xx response is acceptable evidence of valid HTTP transport.
          echo "PASS_B2_PUBLIC_HTTP_TRANSPORT: HTTP $http_status"
      - name: Verify protected configuration and upload encrypted synthetic data
        shell: bash
        env:
          B2_BUCKET: ${{ vars.IAM_G1_B2_BUCKET }}
          B2_ENDPOINT: ${{ vars.IAM_G1_B2_ENDPOINT }}
          B2_REGION: ${{ vars.IAM_G1_B2_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.IAM_G1_B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IAM_G1_B2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          umask 077
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::BLOCKED_MISSING_B2_SECRETS"; exit 1; }
          test "$B2_BUCKET" = "iam-control-center-g1-backups" || { echo "::error::BLOCKED_BUCKET_MISMATCH"; exit 1; }
          test "$B2_ENDPOINT" = "https://s3.us-east-005.backblazeb2.com" || { echo "::error::BLOCKED_ENDPOINT_MISMATCH"; exit 1; }
          test "$B2_REGION" = "us-east-005" || { echo "::error::BLOCKED_REGION_MISMATCH"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/iam-g1-probe-venv"
          "$RUNNER_TEMP/iam-g1-probe-venv/bin/python" -m pip install --disable-pip-version-check --quiet 'boto3>=1.35,<2' 'cryptography>=44,<47'
          "$RUNNER_TEMP/iam-g1-probe-venv/bin/python" - <<'PY'
          import os, hashlib, secrets, datetime
          import boto3
          from botocore.config import Config
          from botocore.exceptions import (ClientError, ConnectionClosedError, EndpointConnectionError, ProxyConnectionError, SSLError)
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          # Only synthetic data; ephemeral encryption key is never exported or logged.
          plaintext = b"IAM-G1-SYNTHETIC-NO-DATABASE-DATA:" + secrets.token_bytes(64)
          key = AESGCM.generate_key(bit_length=256)
          nonce = secrets.token_bytes(12)
          ciphertext = nonce + AESGCM(key).encrypt(nonce, plaintext, b"iam-g1-probe-v1")
          assert AESGCM(key).decrypt(nonce, ciphertext[12:], b"iam-g1-probe-v1") == plaintext
          digest = hashlib.sha256(ciphertext).hexdigest()
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          object_key = f"iam-g1/probes/{stamp}-{os.environ['GITHUB_RUN_ID']}.aesgcm"
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["B2_ENDPOINT"],
              region_name=os.environ["B2_REGION"],
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}, retries={"total_max_attempts": 1}),
          )

          # Hypothesis-based compatibility workaround: remove the optional
          # Expect: 100-continue handshake BEFORE SigV4 signing. Some S3
          # compatible gateways/proxies mishandle the interim HTTP response.
          # Never alter Host, authorization, payload, or TLS verification.
          def suppress_expect_continue(request, **_kwargs):
              if (request.headers.get("Expect") or "").lower() == "100-continue":
                  del request.headers["Expect"]

          # Purely local regression guard: no network or secret usage.
          from botocore.awsrequest import AWSRequest
          synthetic_request = AWSRequest(
              method="PUT", url="https://example.invalid/test",
              headers={"Expect": "100-continue"},
          )
          suppress_expect_continue(synthetic_request)
          assert "Expect" not in synthetic_request.headers

          client.meta.events.register("before-sign.s3.PutObject", suppress_expect_continue)
          try:
              client.put_object(
                  Bucket=os.environ["B2_BUCKET"], Key=object_key, Body=ciphertext,
                  ContentType="application/octet-stream",
                  Metadata={"sha256": digest, "classification": "synthetic-encrypted-probe"},
              )
          except (ConnectionClosedError, EndpointConnectionError, ProxyConnectionError, SSLError):
              print("::error::BLOCKED_B2_SIGNED_UPLOAD_TRANSPORT: TLS, proxy, or invalid HTTP response")
              raise SystemExit(2)
          except ClientError as error:
              s3_code = error.response.get("Error", {}).get("Code", "UNKNOWN")
              print(f"::error::BLOCKED_B2_S3_REQUEST: {s3_code}")
              raise SystemExit(3)
          print("PASS_B2_ENCRYPTED_SYNTHETIC_UPLOAD")
          print(f"object_key={object_key}")
          print(f"ciphertext_sha256={digest}")
          print("READBACK_NOT_TESTED: requires separately approved read-only credential")
          print("G1_FULL_BACKUP_OWNER_APPROVED=BLOCKED")
          PY
