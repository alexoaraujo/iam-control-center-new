name: IAM G1 real isolated restore security contract (offline)

on:
  pull_request:
    paths:
      - 'scripts/iam-g1-full-restore.py'
      - '.github/tests/test-iam-g1-real-restore.py'
      - '.github/tests/g1-pg18-private-toc.py'
      - 'database/tests/fixtures/pg18-system-ca.Dockerfile'
      - '.github/tests/test-iam-g1-main-checks-pagination.py'
      - '.github/scripts/iam-g1-verify-main-checks.py'
      - '.github/workflows/iam-g1-b2-isolated-full-restore.yml'
      - '.github/workflows/iam-g1-real-restore-offline-contract.yml'
      - 'docs/operations/iam-g1-real-isolated-restore-20261122.md'
  push:
    branches: [main]
    paths:
      - 'scripts/iam-g1-full-restore.py'
      - '.github/tests/test-iam-g1-real-restore.py'
      - '.github/tests/g1-pg18-private-toc.py'
      - 'database/tests/fixtures/pg18-system-ca.Dockerfile'
      - '.github/tests/test-iam-g1-main-checks-pagination.py'
      - '.github/scripts/iam-g1-verify-main-checks.py'
      - '.github/workflows/iam-g1-b2-isolated-full-restore.yml'
      - '.github/workflows/iam-g1-real-restore-offline-contract.yml'
      - 'docs/operations/iam-g1-real-isolated-restore-20261122.md'

permissions:
  contents: read

jobs:
  g1-real-restore-offline-contract:
    if: github.repository == 'alexoaraujo/iam-control-center-new'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Compile protected restore executor and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/iam-g1-full-restore.py \
            .github/tests/test-iam-g1-real-restore.py \
            .github/scripts/iam-g1-verify-main-checks.py \
            .github/tests/test-iam-g1-main-checks-pagination.py
      - name: Execute synthetic negative security contracts without B2 or Neon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/g1-restore-tests"
          "$RUNNER_TEMP/g1-restore-tests/bin/python" -m pip install \
            --disable-pip-version-check --quiet 'cryptography>=44,<47'
          "$RUNNER_TEMP/g1-restore-tests/bin/python" \
            .github/tests/test-iam-g1-real-restore.py -v
          python3 .github/tests/test-iam-g1-main-checks-pagination.py -v
          echo 'PASS_G1_REAL_RESTORE_OFFLINE_GUARDS'
          echo 'G1_REAL_AES_GCM_DECRYPTION=NOT_ATTESTED'
          echo 'G1_FULL_BACKUP_RESTORE=NOT_ATTESTED'
      - name: Restore a synthetic PG18 archive using the private runner-owned TOC
        shell: bash
        run: |
          set -euo pipefail
          docker build -f database/tests/fixtures/pg18-system-ca.Dockerfile \
            -t iam-pg18-system-ca:local database/tests/fixtures
          fixture=$(docker run -d --rm -p 127.0.0.1::5432 \
            -e POSTGRES_PASSWORD=synthetic-local-only postgres:18-bookworm)
          trap 'docker rm -fv "$fixture" >/dev/null' EXIT
          python3 .github/tests/g1-pg18-private-toc.py "$fixture"
