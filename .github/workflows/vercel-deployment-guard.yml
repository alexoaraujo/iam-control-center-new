name: Vercel deployment configuration guard

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/web/**"
      - ".github/workflows/vercel-deployment-guard.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/web/**"
      - ".github/workflows/vercel-deployment-guard.yml"

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Assert Node.js engine agrees with deployment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const root = JSON.parse(readFileSync('package.json','utf8'));
          if (root.engines?.node !== '>=24 <25') throw new Error('Expected Node 24 engine range');
          if (!root.packageManager?.startsWith('pnpm@10.34.9')) throw new Error('pnpm version mismatch');
          NODE
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build with inert CI-only Auth0 values
        env:
          AUTH0_DOMAIN: ci-only.invalid
          AUTH0_CLIENT_ID: ci-build-only
          AUTH0_CLIENT_SECRET: ci-build-only-not-a-credential
          AUTH0_SECRET: ci-build-only-secret-not-valid-for-any-environment
          APP_BASE_URL: http://localhost:3000
        run: pnpm build
