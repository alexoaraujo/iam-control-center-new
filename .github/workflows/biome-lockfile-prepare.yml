name: Temporary Biome lockfile generator

on:
  pull_request:
    paths:
      - "apps/web/package.json"
      - "apps/web/biome.json"
      - ".github/workflows/biome-lockfile-prepare.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  regen-lock:
    name: regenerate-biome-lockfile
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/biome-lint-no-picomatch-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proposed changes without write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Generate deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
          test -s pnpm-lock.yaml
          echo "Generated lockfile sha256:"
          sha256sum pnpm-lock.yaml
          echo 'IAM_BIOME_LOCKFILE_BEGIN'
          base64 -w 4000 pnpm-lock.yaml
          echo 'IAM_BIOME_LOCKFILE_END'

  validate-biome:
    name: biome-lint-proof
    if: github.repository == 'alexoaraujo/iam-control-center-new' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'experiment/biome-lint-no-picomatch-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proposed changes without write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Frozen lockfile installation
        run: pnpm install --frozen-lockfile
      - name: Biome lint
        run: pnpm lint
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Vitest regressions
        run: pnpm test
      - name: Security and Preview script contracts
        run: node --test scripts/*.test.mjs
      - name: Next.js build with inert CI-only auth values
        env:
          AUTH0_DOMAIN: ci-only.invalid
          AUTH0_CLIENT_ID: ci-build-only
          AUTH0_CLIENT_SECRET: ci-build-only-not-a-credential
          AUTH0_SECRET: ci-build-only-secret-not-valid-for-any-environment
          APP_BASE_URL: http://localhost:3000
        run: pnpm build
      - name: Mandatory full dependency audit
        run: pnpm audit
